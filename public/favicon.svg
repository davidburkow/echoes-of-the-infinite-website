<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b4b3ff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#7170f3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000008" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000003"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#000008"/>

  <!-- Outer ambient nebula glow -->
  <circle cx="16" cy="16" r="15" fill="url(#glow)"/>

  <!-- Outer dim ring -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#7170f3" stroke-width="0.6" opacity="0.3"/>

  <!-- Main accretion ring -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#8988f8" stroke-width="2.8"/>

  <!-- Bright inner edge (photon sphere) -->
  <circle cx="16" cy="16" r="9.8" fill="none" stroke="#d0cfff" stroke-width="0.8" opacity="0.65"/>

  <!-- Black hole core -->
  <circle cx="16" cy="16" r="8.5" fill="url(#core)"/>
</svg>
